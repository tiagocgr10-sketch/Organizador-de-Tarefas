<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Organizador de Tarefas</title>
    <!-- Tailwind CSS para um design moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js para o Gráfico do Dashboard -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans min-h-screen pb-12">

    <!-- Cabeçalho -->
    <header class="bg-indigo-600 text-white shadow-md py-6 mb-8">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold"><i class="fa-solid fa-clipboard-check mr-2"></i> Meu Organizador de Tarefas</h1>
            <span class="text-sm bg-indigo-700 px-3 py-1 rounded-full">Dashboard Ativo</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 space-y-8">

        <!-- DASHBOARD (Cards de Estatísticas) -->
        <section class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-500 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-500 font-medium">Total de Tarefas</p>
                    <h3 id="stat-total" class="text-2xl font-bold text-gray-800">0</h3>
                </div>
                <i class="fa-solid fa-list-check text-blue-500 text-3xl"></i>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-yellow-500 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-500 font-medium">Pendentes</p>
                    <h3 id="stat-pending" class="text-2xl font-bold text-gray-800">0</h3>
                </div>
                <i class="fa-solid fa-clock text-yellow-500 text-3xl"></i>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-green-500 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-500 font-medium">Concluídas</p>
                    <h3 id="stat-completed" class="text-2xl font-bold text-gray-800">0</h3>
                </div>
                <i class="fa-solid fa-circle-check text-green-500 text-3xl"></i>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-purple-500 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-500 font-medium">Taxa de Conclusão</p>
                    <h3 id="stat-rate" class="text-2xl font-bold text-gray-800">0%</h3>
                </div>
                <i class="fa-solid fa-chart-pie text-purple-500 text-3xl"></i>
            </div>
        </section>

        <!-- SEÇÃO PRINCIPAL: FORMULÁRIO E GRÁFICO -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Formulário de Cadastro -->
            <section class="bg-white p-6 rounded-xl shadow-sm lg:col-span-1">
                <h2 class="text-lg font-bold text-gray-800 mb-4"><i class="fa-solid fa-plus-circle mr-2 text-indigo-600"></i> Nova Tarefa</h2>
                <form id="task-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Título da Tarefa</label>
                        <input type="text" id="task-title" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Ex: Estudar JavaScript">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Categoria (Lista Suspensa)</label>
                        <select id="task-category" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="Trabalho">Trabalho</option>
                            <option value="Estudos">Estudos</option>
                            <option value="Pessoal">Pessoal</option>
                            <option value="Finanças">Finanças</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Prioridade</label>
                        <select id="task-priority" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="Baixa">Baixa</option>
                            <option value="Média" selected>Média</option>
                            <option value="Alta">Alta</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Data de Prazo</label>
                        <input type="date" id="task-duedate" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition duration-200">
                        Adicionar Tarefa
                    </button>
                </form>
            </section>

            <!-- Gráfico de Status -->
            <section class="bg-white p-6 rounded-xl shadow-sm lg:col-span-2 flex flex-col items-center justify-center">
                <h2 class="text-lg font-bold text-gray-800 mb-2 self-start"><i class="fa-solid fa-chart-bar mr-2 text-indigo-600"></i> Progresso das Tarefas</h2>
                <div class="w-full max-w-md h-64 flex items-center justify-center">
                    <canvas id="taskChart"></canvas>
                </div>
            </section>

        </div>

        <!-- LISTA DE TAREFAS E FILTROS -->
        <section class="bg-white p-6 rounded-xl shadow-sm">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <h2 class="text-lg font-bold text-gray-800"><i class="fa-solid fa-list mr-2 text-indigo-600"></i> Suas Tarefas</h2>
                
                <!-- Filtros por Lista Suspensa -->
                <div class="flex flex-wrap gap-3 w-full md:w-auto">
                    <select id="filter-status" class="border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none">
                        <option value="all">Todos os Status</option>
                        <option value="pending">Pendentes</option>
                        <option value="completed">Concluídas</option>
                    </select>
                    <select id="filter-category" class="border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none">
                        <option value="all">Todas as Categorias</option>
                        <option value="Trabalho">Trabalho</option>
                        <option value="Estudos">Estudos</option>
                        <option value="Pessoal">Pessoal</option>
                        <option value="Finanças">Finanças</option>
                    </select>
                </div>
            </div>

            <!-- Tabela de Tarefas -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b text-gray-600 text-sm">
                            <th class="py-3 px-4">Status</th>
                            <th class="py-3 px-4">Tarefa</th>
                            <th class="py-3 px-4">Categoria</th>
                            <th class="py-3 px-4">Prioridade</th>
                            <th class="py-3 px-4">Prazo</th>
                            <th class="py-3 px-4 text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="task-table-body" class="divide-y divide-gray-100 text-sm">
                        <!-- Inserido via JavaScript -->
                    </tbody>
                </table>
            </div>
            <div id="empty-state" class="text-center py-8 text-gray-400 hidden">
                Nenhuma tarefa encontrada.
            </div>
        </section>

    </main>

    <!-- Script de Funcionamento -->
    <script>
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let taskChart = null;

        // Elementos do DOM
        const taskForm = document.getElementById('task-form');
        const taskTitleInput = document.getElementById('task-title');
        const taskCategoryInput = document.getElementById('task-category');
        const taskPriorityInput = document.getElementById('task-priority');
        const taskDueDateInput = document.getElementById('task-duedate');
        
        const taskTableBody = document.getElementById('task-table-body');
        const emptyState = document.getElementById('empty-state');
        
        const filterStatus = document.getElementById('filter-status');
        const filterCategory = document.getElementById('filter-category');

        const statTotal = document.getElementById('stat-total');
        const statPending = document.getElementById('stat-pending');
        const statCompleted = document.getElementById('stat-completed');
        const statRate = document.getElementById('stat-rate');

        // Event Listeners
        taskForm.addEventListener('submit', addTask);
        filterStatus.addEventListener('change', render);
        filterCategory.addEventListener('change', render);

        function addTask(e) {
            e.preventDefault();
            const newTask = {
                id: Date.now(),
                title: taskTitleInput.value,
                category: taskCategoryInput.value,
                priority: taskPriorityInput.value,
                dueDate: taskDueDateInput.value,
                completed: false
            };

            tasks.push(newTask);
            saveAndRender();
            taskForm.reset();
        }

        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            saveAndRender();
        }

        function toggleTask(id) {
            tasks = tasks.map(task => {
                if (task.id === id) {
                    return { ...task, completed: !task.completed };
                }
                return task;
            });
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
            render();
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const [year, month, day] = dateString.split('-');
            return `${day}/${month}/${year}`;
        }

        function render() {
            // Aplicar Filtros
            const statusVal = filterStatus.value;
            const categoryVal = filterCategory.value;

            const filteredTasks = tasks.filter(task => {
                const matchesStatus = statusVal === 'all' || 
                    (statusVal === 'completed' && task.completed) || 
                    (statusVal === 'pending' && !task.completed);
                
                const matchesCategory = categoryVal === 'all' || task.category === categoryVal;

                return matchesStatus && matchesCategory;
            });

            // Ordenar por data de vencimento (mais próximo primeiro)
            filteredTasks.sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));

            // Renderizar Tabela
            taskTableBody.innerHTML = '';
            if (filteredTasks.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                
                const todayStr = new Date().toISOString().split('T')[0];

                filteredTasks.forEach(task => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-50 transition";
                    
                    // Cor da prioridade
                    let priorityColor = "bg-gray-100 text-gray-800";
                    if (task.priority === 'Alta') priorityColor = "bg-red-100 text-red-700";
                    if (task.priority === 'Média') priorityColor = "bg-yellow-100 text-yellow-700";
                    if (task.priority === 'Baixa') priorityColor = "bg-green-100 text-green-700";

                    // Validação de Atraso
                    let dateClass = "text-gray-600";
                    let alertBadge = "";
                    if (!task.completed && task.dueDate < todayStr) {
                        dateClass = "text-red-600 font-semibold";
                        alertBadge = ` <span class="text-[10px] bg-red-100 text-red-600 px-1.5 py-0.5 rounded ml-1">Atrasado</span>`;
                    }

                    tr.innerHTML = `
                        <td class="py-3 px-4">
                            <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="toggleTask(${task.id})" class="w-4 h-4 text-indigo-600 rounded cursor-pointer">
                        </td>
                        <td class="py-3 px-4 font-medium ${task.completed ? 'line-through text-gray-400' : 'text-gray-800'}">${task.title}</td>
                        <td class="py-3 px-4 text-gray-600">${task.category}</td>
                        <td class="py-3 px-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${priorityColor}">${task.priority}</span></td>
                        <td class="py-3 px-4 ${dateClass}">${formatDate(task.dueDate)}${alertBadge}</td>
                        <td class="py-3 px-4 text-center">
                            <button onclick="deleteTask(${task.id})" class="text-red-500 hover:text-red-700 p-1"><i class="fa-solid fa-trash-can"></i></button>
                        </td>
                    `;
                    taskTableBody.appendChild(tr);
                });
            }

            updateDashboard();
        }

        function updateDashboard() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const pending = total - completed;
            const rate = total > 0 ? Math.round((completed / total) * 100) : 0;

            statTotal.textContent = total;
            statPending.textContent = pending;
            statCompleted.textContent = completed;
            statRate.textContent = `${rate}%`;

            updateChart(pending, completed);
        }

        function updateChart(pending, completed) {
            const ctx = document.getElementById('taskChart').getContext('2d');
            
            if (taskChart) {
                taskChart.data.datasets[0].data = [pending, completed];
                taskChart.update();
            } else {
                taskChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Pendentes', 'Concluídas'],
                        datasets: [{
                            data: [pending, completed],
                            backgroundColor: ['#F59E0B', '#10B981'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom'
                            }
                        }
                    }
                });
            }
        }

        // Inicializar aplicação
        render();
    </script>
</body>
</html>
